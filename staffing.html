<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタッフ配置ボード</title>
<style>
  :root{
    --gold:#FFD400;
    --gold-deep:#F5A800;
    --amber:#E08A00;
    --brown:#7A4A12;
    --foam:#FFFDF3;
    --cream:#FFF6DC;
    --ink:#1A1A1A;
    --ink-2:#7A6A48;
    --line:#1A1A1A;
    --hard:4px 4px 0 var(--ink);
    --hard-sm:3px 3px 0 var(--ink);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Sans","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.9) 7px, transparent 7.5px),
      radial-gradient(circle at 68% 42%, rgba(255,255,255,.75) 11px, transparent 11.5px),
      radial-gradient(circle at 88% 78%, rgba(255,255,255,.85) 6px, transparent 6.5px),
      radial-gradient(circle at 34% 82%, rgba(255,255,255,.7) 9px, transparent 9.5px);
    background-size:220px 220px, 300px 300px, 180px 180px, 260px 260px;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;font-weight:700}
  input,select,textarea{font-family:inherit;font-size:inherit;font-weight:600}

  /* ---------- layout ---------- */
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header.top{
    display:flex;align-items:center;gap:12px;
    padding:10px 16px 14px;
    background:linear-gradient(180deg,#FFE24D 0%,var(--gold) 55%,var(--gold-deep) 100%);
    border-bottom:4px solid var(--ink);
    flex-wrap:wrap;row-gap:8px;position:relative;z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;flex:none}
  header.top .btn{flex:none}
  .brand .dot{
    width:46px;height:46px;flex:none;border-radius:50%;
    background:var(--foam) center/86% no-repeat;
    border:3px solid var(--ink);box-shadow:var(--hard-sm);
  }
  .brand .btxt{display:flex;flex-direction:column;line-height:1.2}
  .brand b{font-size:17px;letter-spacing:.02em;text-shadow:1.5px 1.5px 0 rgba(255,255,255,.6)}
  .brand small{font-weight:700;font-size:11px;color:#6B4A00;letter-spacing:0;white-space:nowrap}
  .spacer{flex:1}

  .btn{
    border:2.5px solid var(--ink);background:var(--foam);color:var(--ink);
    padding:7px 13px;border-radius:999px;line-height:1.2;white-space:nowrap;
    box-shadow:var(--hard-sm);transition:.08s;
  }
  .btn:hover{background:#fff;transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.primary{background:var(--gold);color:var(--ink)}
  .btn.primary:hover{background:#FFE24D}
  .btn.ghost{background:rgba(255,255,255,.55)}
  .btn.ghost:hover{background:#fff}
  .btn.sm{padding:4px 10px;font-size:12px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
  .btn.sm:hover{box-shadow:1px 1px 0 var(--ink)}
  .btn.danger:hover{background:#FFE0D2}

  .scenario-bar{
    display:flex;align-items:center;gap:5px;background:var(--foam);
    border:2.5px solid var(--ink);border-radius:999px;padding:4px 7px;flex:none;flex-wrap:wrap;
    box-shadow:var(--hard-sm);
  }
  .scenario-bar>*{flex:none}
  .scenario-bar .lbl{font-size:11px;color:var(--ink-2);padding:0 4px;font-weight:800}
  .chip{
    border:2px solid transparent;background:transparent;padding:4px 12px;border-radius:999px;
    font-size:13px;color:var(--ink-2);white-space:nowrap;font-weight:800;
  }
  .chip:hover{background:var(--cream)}
  .chip.active{background:var(--gold);color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}

  .body{flex:1;display:flex;min-height:0}

  /* ---------- sidebar ---------- */
  aside{
    width:274px;flex:none;background:var(--foam);border-right:4px solid var(--ink);
    display:flex;flex-direction:column;min-height:0;
  }
  .side-head{padding:12px 14px 10px;border-bottom:3px dashed #E3CE8E;position:relative}
  .side-head h2{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
  .side-head h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--gold);border:2.5px solid var(--ink)}
  .side-head p{margin:0;font-size:11px;color:var(--ink-2);line-height:1.55}
  .side-tools{padding:9px 12px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:3px dashed #E3CE8E}
  .search{width:100%;padding:7px 12px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;box-shadow:2px 2px 0 var(--ink)}
  .search:focus{outline:none;background:#FFFBEA}
  .pool{
    flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-wrap:wrap;gap:13px;align-content:flex-start;
  }
  .pool.drop-hot{background:#FFF3C2;outline:3px dashed var(--amber);outline-offset:-7px}
  .pool .empty{
    color:var(--ink-2);font-size:12px;text-align:center;width:100%;padding:10px 8px;line-height:1.8;font-weight:700;
  }
  .pool .empty img{width:108px;display:block;margin:0 auto 8px;opacity:.95}

  /* ---------- avatar ---------- */
  .person{width:70px;display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:none;user-select:none}
  .avatar{
    width:58px;height:58px;border-radius:50%;flex:none;position:relative;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    border:3px solid var(--ink);box-shadow:var(--hard-sm);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:17px;cursor:grab;
    transition:transform .1s;
  }
  .avatar:active{cursor:grabbing}
  .person:hover .avatar{transform:translateY(-3px) rotate(-3deg)}
  .avatar.lg{width:66px;height:66px;font-size:19px}
  .pname{font-size:11px;line-height:1.25;text-align:center;color:var(--ink);max-width:70px;overflow-wrap:anywhere;font-weight:800}
  .ptag{font-size:9.5px;color:var(--ink-2);line-height:1.2;text-align:center;font-weight:700}
  .avatar .badge{
    position:absolute;right:-5px;bottom:-5px;background:var(--gold);border:2.5px solid var(--ink);
    border-radius:50%;width:22px;height:22px;font-size:11px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;opacity:0;transition:.12s;
  }
  .person:hover .avatar .badge,.slot:hover .avatar .badge{opacity:1}
  .avatar .badge:hover{background:#fff}

  /* ---------- main ---------- */
  main{flex:1;overflow-y:auto;padding:18px 20px 60px;min-width:0}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{
    background:var(--foam);border:3px solid var(--ink);border-radius:16px;padding:8px 15px;min-width:100px;
    box-shadow:var(--hard-sm);
  }
  .stat b{display:block;font-size:22px;line-height:1.15;font-weight:800}
  .stat span{font-size:11px;color:var(--ink-2);font-weight:700}
  .stat.alert{background:var(--gold)}
  .stat.alert b{color:#B34700}

  .stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;align-items:start}
  .store{
    background:var(--foam);border:3.5px solid var(--ink);border-radius:var(--radius);
    box-shadow:var(--hard);overflow:visible;
  }
  .store-head{
    display:flex;align-items:center;gap:6px;padding:11px 12px 13px;
    background:linear-gradient(180deg,#FFE24D,var(--gold));
    border-bottom:3px solid var(--ink);position:relative;
    border-radius:16px 16px 0 0;
  }
  /* ビールの泡：ヘッダー下端に白い泡の丸を並べる */
  .store-head::after{
    content:"";position:absolute;left:0;right:0;bottom:3px;height:11px;pointer-events:none;
    background:radial-gradient(circle at 8px 11px, var(--foam) 8px, transparent 8.5px) repeat-x;
    background-size:16px 11px;
  }
  .store-head .nm{
    font-weight:800;font-size:16px;flex:1;min-width:0;border:2px solid transparent;background:transparent;
    border-radius:8px;padding:3px 6px;color:var(--ink);
  }
  .store-head .nm:hover{border-color:var(--ink);background:rgba(255,255,255,.5)}
  .store-head .nm:focus{outline:none;border-color:var(--ink);background:#fff}
  .store-head .cnt{
    font-size:11px;color:var(--ink);white-space:nowrap;font-weight:800;
    background:var(--foam);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;
  }
  .slots{padding:12px 11px 12px;display:flex;flex-direction:column;gap:3px}
  .slot{
    display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;border:2.5px dashed transparent;
    position:relative;
  }
  .slot:hover{background:#FFF8DF}
  .slot.drop-hot{background:#FFF0B8;border-color:var(--amber)}
  .slot .ph{
    width:58px;height:58px;border-radius:50%;flex:none;border:3px dashed #C9B274;background:#FFFBEC;
    display:flex;align-items:center;justify-content:center;color:#C9B274;font-size:22px;font-weight:800;
  }
  .slot-meta{flex:1;min-width:0}
  .slot-title{
    border:2px solid transparent;background:transparent;border-radius:8px;padding:2px 6px;
    font-weight:800;font-size:14px;width:100%;color:var(--ink);
  }
  .slot-title:hover{border-color:#D9C489}
  .slot-title:focus{outline:none;border-color:var(--ink);background:#fff}
  .slot-who{font-size:12px;color:var(--ink-2);padding:0 6px;line-height:1.4;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot-who.vacant{color:#BFAC77}
  .slot-actions{
    display:flex;gap:3px;opacity:0;transition:.12s;
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:rgba(255,253,243,.92);border-radius:999px;padding:3px;
  }
  .slot:hover .slot-actions{opacity:1}
  .store-foot{padding:2px 12px 14px;display:flex;gap:6px;flex-wrap:wrap}

  .add-store{
    border:3.5px dashed var(--amber);border-radius:var(--radius);background:rgba(255,255,255,.5);color:var(--brown);
    min-height:130px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
  }
  .add-store:hover{background:#FFF3C2;border-style:solid;box-shadow:var(--hard)}

  /* ---------- drag ghost ---------- */
  .drag-ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.12) rotate(-5deg);filter:drop-shadow(0 8px 0 rgba(26,26,26,.25))}
  body.dragging{cursor:grabbing}

  /* ---------- modal ---------- */
  .mask{position:fixed;inset:0;background:rgba(122,74,18,.45);display:flex;align-items:center;justify-content:center;z-index:900;padding:18px}
  .modal{
    background:var(--foam);border:4px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 rgba(26,26,26,.9);
    width:100%;max-width:400px;max-height:88vh;overflow:auto;
  }
  .modal h3{
    margin:0;padding:14px 18px;font-size:16px;font-weight:800;
    background:linear-gradient(180deg,#FFE24D,var(--gold));border-bottom:3px solid var(--ink);
  }
  .modal .inner{padding:18px}
  .modal .foot{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:3px dashed #E3CE8E}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;color:var(--ink-2);margin-bottom:5px;font-weight:800}
  .field input[type=text],.field select,.field textarea{
    width:100%;padding:9px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:2px 2px 0 var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;background:#FFFBEA}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .sw.on{transform:translate(1px,1px);box-shadow:0 0 0 3px var(--gold)}

  .cropwrap{display:flex;flex-direction:column;align-items:center;gap:11px}
  .cropbox{
    width:186px;height:186px;border-radius:50%;overflow:hidden;position:relative;
    background:var(--cream);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
    touch-action:none;cursor:move;background-size:cover;background-repeat:no-repeat;
  }
  .rangerow{display:flex;align-items:center;gap:9px;width:100%;font-size:11px;color:var(--ink-2);font-weight:800}
  input[type=range]{flex:1;accent-color:var(--amber)}
  .hint{font-size:11px;color:var(--ink-2);line-height:1.6;text-align:center;font-weight:700}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:var(--ink);padding:10px 20px;border-radius:999px;font-size:12.5px;font-weight:800;
    border:3px solid var(--ink);box-shadow:var(--hard);
    z-index:9998;opacity:0;transition:.2s;pointer-events:none;
  }
  .toast.show{opacity:1}

  @media print{
    aside,header.top,.store-foot,.add-store,.slot-actions,.summary{display:none !important}
    .app{height:auto;overflow:visible}
    main{overflow:visible;padding:0}
    .stores{grid-template-columns:repeat(2,1fr)}
    .store{break-inside:avoid;box-shadow:none}
    body{background:#fff;background-image:none}
  }
  @media (max-width:860px){
    aside{width:220px}
    .stores{grid-template-columns:1fr}
  }

</style>
</head>

const COLORS = ["#F5A800","#E2571E","#2FA36B","#3B7DD8","#9B5DE5","#00B0BE","#E23E7A","#7A4A12"];
let uid = 1;
const nid = () => "id" + (uid++) + "_" + Math.floor(performance.now() * 1000 % 100000);

let state = {
  staff: [],      // {id,name,note,color,img:{src,zoom,x,y}|null}
  stores: [],     // {id,name,slots:[{id,title}]}
  scenarios: [],  // {id,name,assign:{slotId:staffId}}
  current: null
};

function seed(){
  state.stores = [
    { id:nid(), name:"店舗A", slots:[
      {id:nid(),title:"店長"},{id:nid(),title:"副店長"},{id:nid(),title:"社員"},{id:nid(),title:"アルバイト"}
    ]},
    { id:nid(), name:"店舗B", slots:[
      {id:nid(),title:"店長"},{id:nid(),title:"社員"},{id:nid(),title:"アルバイト"}
    ]}
  ];
  SEED_STAFF.forEach((sp, i) => {
    state.staff.push({
      id: nid(), name: sp.name, note: "",
      color: COLORS[i % COLORS.length],
      img: { src: sp.src, zoom: 1.5, x: 50, y: 50 }
    });
  });
  const s1 = { id:nid(), name:"案A", assign:{} };
  state.scenarios = [s1];
  state.current = s1.id;
}

const cur = () => state.scenarios.find(s => s.id === state.current);
const staffById = id => state.staff.find(s => s.id === id);
const slotOf = staffId => {
  const a = cur().assign;
  for (const k in a) if (a[k] === staffId) return k;
  return null;
};
function allSlots(){
  const out = [];
  state.stores.forEach(st => st.slots.forEach(sl => out.push({store:st, slot:sl})));
  return out;
}

/* ============================================================
   アバター描画
   ============================================================ */
function initials(name){
  const n = (name||"").trim();
  if(!n) return "?";
  return n.replace(/\s+/g,"").slice(0,2);
}
function avatarStyle(p){
  if(p.img && p.img.src){
    const z = p.img.zoom || 1;
    return `background-image:url('${p.img.src}');background-size:${z*100}% auto;background-position:${p.img.x}% ${p.img.y}%;color:transparent;`;
  }
  return `background:${p.color};`;
}
function avatarEl(p, opts){
  opts = opts || {};
  const d = document.createElement("div");
  d.className = "avatar" + (opts.lg ? " lg" : "");
  d.setAttribute("style", avatarStyle(p));
  d.textContent = p.img && p.img.src ? "" : initials(p.name);
  d.dataset.staff = p.id;
  if(opts.edit){
    const b = document.createElement("div");
    b.className = "badge";
    b.textContent = "✎";
    b.title = "編集";
    b.addEventListener("pointerdown", e => e.stopPropagation());
    b.addEventListener("click", e => { e.stopPropagation(); openPerson(p.id); });
    d.appendChild(b);
  }
  return d;
}
function personEl(p, opts){
  opts = opts || {};
  const w = document.createElement("div");
  w.className = "person";
  const av = avatarEl(p, {lg:opts.lg, edit:true});
  w.appendChild(av);
  const n = document.createElement("div");
  n.className = "pname";
  n.textContent = p.name || "(無名)";
  w.appendChild(n);
  if(p.note){
    const t = document.createElement("div");
    t.className = "ptag";
    t.textContent = p.note;
    w.appendChild(t);
  }
  av.addEventListener("pointerdown", e => startDrag(e, p.id));
  return w;
}

function render(){
  renderScenarios();
  renderPool();
  renderStores();
  renderSummary();
}

function renderScenarios(){
  const bar = document.getElementById("scenarioBar");
  bar.innerHTML = "";
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = "配置案";
  bar.appendChild(lbl);
  state.scenarios.forEach(sc => {
    const b = document.createElement("button");
    b.className = "chip" + (sc.id === state.current ? " active" : "");
    b.textContent = sc.name;
    b.title = "クリックで切替 / 選択中をもう一度クリックで名前変更";
    b.onclick = () => {
      if(sc.id === state.current){
        const v = prompt("配置案の名前", sc.name);
        if(v !== null && v.trim()) sc.name = v.trim();
      } else state.current = sc.id;
      render();
    };
    bar.appendChild(b);
  });
  const dup = document.createElement("button");
  dup.className = "btn sm ghost";
  dup.textContent = "＋複製";
  dup.title = "今の配置をコピーして別案を作る";
  dup.onclick = () => {
    const c = cur();
    const sc = { id:nid(), name:"案" + String.fromCharCode(65 + state.scenarios.length), assign:Object.assign({}, c.assign) };
    state.scenarios.push(sc);
    state.current = sc.id;
    render();
    toast("「" + sc.name + "」を作りました。ここで自由に組み替えできます");
  };
  bar.appendChild(dup);
  if(state.scenarios.length > 1){
    const del = document.createElement("button");
    del.className = "btn sm ghost";
    del.textContent = "削除";
    del.onclick = () => {
      if(!confirm("配置案「" + cur().name + "」を削除しますか？（スタッフ・店舗は消えません）")) return;
      state.scenarios = state.scenarios.filter(s => s.id !== state.current);
      state.current = state.scenarios[0].id;
      render();
    };
    bar.appendChild(del);
  }
}

function renderPool(){
  const pool = document.getElementById("pool");
  const q = document.getElementById("search").value.trim().toLowerCase();
  pool.innerHTML = "";
  const list = state.staff.filter(p => !slotOf(p.id))
    .filter(p => !q || (p.name + " " + (p.note||"")).toLowerCase().includes(q));
  if(!list.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = state.staff.length
      ? '<img src="' + KUMA + '" alt="">該当なし。<br>全員どこかに配置されてるよ！'
      : '<img src="' + KUMA + '" alt="">まだスタッフがいないよ。<br>上の「＋写真からスタッフ追加」で<br>顔写真をまとめて取り込めます。';
    pool.appendChild(e);
    return;
  }
  list.forEach(p => pool.appendChild(personEl(p, {lg:false})));
}

function renderStores(){
  const wrap = document.getElementById("stores");
  wrap.innerHTML = "";
  state.stores.forEach(st => wrap.appendChild(storeCard(st)));
  const add = document.createElement("button");
  add.className = "add-store";
  add.textContent = "＋ 店舗を追加";
  add.onclick = () => {
    const n = prompt("店舗名", "店舗" + String.fromCharCode(65 + state.stores.length));
    if(n === null) return;
    state.stores.push({ id:nid(), name:n.trim() || "新店舗", slots:[
      {id:nid(),title:"店長"},{id:nid(),title:"社員"},{id:nid(),title:"アルバイト"}
    ]});
    render();
  };
  wrap.appendChild(add);
}

function storeCard(st){
  const a = cur().assign;
  const filled = st.slots.filter(s => a[s.id]).length;

  const card = document.createElement("div");
  card.className = "store";

  const head = document.createElement("div");
  head.className = "store-head";
  const nm = document.createElement("input");
  nm.className = "nm";
  nm.value = st.name;
  nm.onchange = () => { st.name = nm.value.trim() || "無題の店舗"; renderSummary(); };
  head.appendChild(nm);
  const cnt = document.createElement("span");
  cnt.className = "cnt";
  cnt.textContent = filled + " / " + st.slots.length + " 名";
  head.appendChild(cnt);
  const del = document.createElement("button");
  del.className = "btn sm ghost danger";
  del.textContent = "✕";
  del.title = "店舗を削除";
  del.onclick = () => {
    if(!confirm("「" + st.name + "」を削除しますか？（配置されていた人は未配属に戻ります）")) return;
    st.slots.forEach(s => state.scenarios.forEach(sc => delete sc.assign[s.id]));
    state.stores = state.stores.filter(x => x.id !== st.id);
    render();
  };
  head.appendChild(del);
  card.appendChild(head);

  const slots = document.createElement("div");
  slots.className = "slots";
  st.slots.forEach((sl, i) => slots.appendChild(slotRow(st, sl, i)));
  card.appendChild(slots);

  const foot = document.createElement("div");
  foot.className = "store-foot";
  ["店長","副店長","社員","アルバイト","キッチン","ホール"].forEach(t => {
    const b = document.createElement("button");
    b.className = "btn sm";
    b.textContent = "＋" + t;
    b.onclick = () => { st.slots.push({id:nid(), title:t}); render(); };
    foot.appendChild(b);
  });
  const bf = document.createElement("button");
  bf.className = "btn sm ghost";
  bf.textContent = "＋自由枠";
  bf.onclick = () => { st.slots.push({id:nid(), title:"役職名"}); render(); };
  foot.appendChild(bf);
  card.appendChild(foot);

  return card;
}

function slotRow(st, sl){
  const a = cur().assign;
  const pid = a[sl.id];
  const p = pid ? staffById(pid) : null;

  const row = document.createElement("div");
  row.className = "slot";
  row.dataset.drop = "slot";
  row.dataset.slot = sl.id;

  if(p){
    const av = avatarEl(p, {lg:true, edit:true});
    av.addEventListener("pointerdown", e => startDrag(e, p.id));
    row.appendChild(av);
  } else {
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = "＋";
    row.appendChild(ph);
  }

  const meta = document.createElement("div");
  meta.className = "slot-meta";
  const t = document.createElement("input");
  t.className = "slot-title";
  t.value = sl.title;
  t.onchange = () => { sl.title = t.value.trim() || "役職"; };
  meta.appendChild(t);
  const who = document.createElement("div");
  who.className = "slot-who" + (p ? "" : " vacant");
  who.textContent = p ? (p.name + (p.note ? "　" + p.note : "")) : "ここへドラッグ";
  meta.appendChild(who);
  row.appendChild(meta);

  const acts = document.createElement("div");
  acts.className = "slot-actions";
  if(p){
    const out = document.createElement("button");
    out.className = "btn sm ghost";
    out.textContent = "外す";
    out.onclick = () => { delete a[sl.id]; render(); };
    acts.appendChild(out);
  }
  const dup = document.createElement("button");
  dup.className = "btn sm ghost";
  dup.textContent = "複製";
  dup.title = "同じ役職の枠をもう1つ";
  dup.onclick = () => {
    const i = st.slots.findIndex(x => x.id === sl.id);
    st.slots.splice(i+1, 0, {id:nid(), title:sl.title});
    render();
  };
  acts.appendChild(dup);
  const rm = document.createElement("button");
  rm.className = "btn sm ghost danger";
  rm.textContent = "✕";
  rm.title = "枠を削除";
  rm.onclick = () => {
    state.scenarios.forEach(sc => delete sc.assign[sl.id]);
    st.slots = st.slots.filter(x => x.id !== sl.id);
    render();
  };
  acts.appendChild(rm);
  row.appendChild(acts);

  return row;
}

function renderSummary(){
  const a = cur().assign;
  const slots = allSlots();
  const filled = slots.filter(s => a[s.slot.id]).length;
  const unassigned = state.staff.filter(p => !slotOf(p.id)).length;
  const box = document.getElementById("summary");
  box.innerHTML = "";
  const items = [
    ["スタッフ総数", state.staff.length, false],
    ["配置済み", filled, false],
    ["未配属", unassigned, unassigned > 0],
    ["空き枠", slots.length - filled, slots.length - filled > 0],
    ["店舗数", state.stores.length, false]
  ];
  items.forEach(([label, val, alert]) => {
    const d = document.createElement("div");
    d.className = "stat" + (alert ? " alert" : "");
    d.innerHTML = "<b>" + val + "</b><span>" + label + "</span>";
    box.appendChild(d);
  });
}

/* ============================================================
   ドラッグ＆ドロップ（pointer events）
   ============================================================ */
let drag = null;
function startDrag(e, staffId){
  if(e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const p = staffById(staffId);
  if(!p) return;
  const ghost = document.createElement("div");
  ghost.className = "drag-ghost";
  const av = avatarEl(p, {lg:true});
  ghost.appendChild(av);
  document.body.appendChild(ghost);
  drag = { staffId, ghost, hot:null, moved:false };
  document.body.classList.add("dragging");
  moveGhost(e);
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", onDragUp);
  window.addEventListener("pointercancel", onDragUp);
}
function moveGhost(e){
  drag.ghost.style.left = e.clientX + "px";
  drag.ghost.style.top = e.clientY + "px";
}
function targetAt(e){
  drag.ghost.style.display = "none";
  const el = document.elementFromPoint(e.clientX, e.clientY);
  drag.ghost.style.display = "";
  return el ? el.closest("[data-drop]") : null;
}
function onDragMove(e){
  if(!drag) return;
  drag.moved = true;
  moveGhost(e);
  const t = targetAt(e);
  if(t !== drag.hot){
    if(drag.hot) drag.hot.classList.remove("drop-hot");
    if(t) t.classList.add("drop-hot");
    drag.hot = t;
  }
}
function onDragUp(e){
  if(!drag) return;
  const t = targetAt(e);
  if(drag.hot) drag.hot.classList.remove("drop-hot");
  drag.ghost.remove();
  document.body.classList.remove("dragging");
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", onDragUp);
  window.removeEventListener("pointercancel", onDragUp);
  const id = drag.staffId, moved = drag.moved;
  drag = null;
  if(!t){ if(!moved) openPerson(id); return; }
  if(t.dataset.drop === "pool"){
    const s = slotOf(id);
    if(s) delete cur().assign[s];
    render();
    return;
  }
  if(t.dataset.drop === "slot"){
    assign(t.dataset.slot, id);
    render();
  }
}
function assign(slotId, staffId){
  const a = cur().assign;
  const from = slotOf(staffId);
  const occupant = a[slotId];
  if(from) delete a[from];
  a[slotId] = staffId;
  if(occupant && occupant !== staffId){
    if(from) a[from] = occupant;   // 入れ替え
  }
}

/* ============================================================
   スタッフ編集モーダル
   ============================================================ */
let modalEl = null;
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl = null; } }
function buildModal(title){
  closeModal();
  const mask = document.createElement("div");
  mask.className = "mask";
  mask.onclick = e => { if(e.target === mask) closeModal(); };
  const m = document.createElement("div");
  m.className = "modal";
  const h = document.createElement("h3");
  h.textContent = title;
  m.appendChild(h);
  const inner = document.createElement("div");
  inner.className = "inner";
  m.appendChild(inner);
  const foot = document.createElement("div");
  foot.className = "foot";
  m.appendChild(foot);
  mask.appendChild(m);
  document.body.appendChild(mask);
  modalEl = mask;
  return { inner, foot };
}

function openPerson(id){
  const p = staffById(id);
  if(!p) return;
  const { inner, foot } = buildModal("スタッフを編集");
  const work = { zoom: p.img ? p.img.zoom : 1, x: p.img ? p.img.x : 50, y: p.img ? p.img.y : 50 };

  const cw = document.createElement("div");
  cw.className = "cropwrap";
  const box = document.createElement("div");
  box.className = "cropbox";
  cw.appendChild(box);

  const rr = document.createElement("div");
  rr.className = "rangerow";
  rr.innerHTML = "<span>拡大</span>";
  const rng = document.createElement("input");
  rng.type = "range"; rng.min = "100"; rng.max = "320"; rng.value = String(work.zoom * 100);
  rr.appendChild(rng);
  cw.appendChild(rr);

  const btns = document.createElement("div");
  btns.style.cssText = "display:flex;gap:8px";
  const pick = document.createElement("button");
  pick.className = "btn sm";
  pick.textContent = p.img ? "写真を変更" : "写真を選ぶ";
  btns.appendChild(pick);
  if(p.img){
    const rmp = document.createElement("button");
    rmp.className = "btn sm ghost";
    rmp.textContent = "写真を外す";
    rmp.onclick = () => { p.img = null; closeModal(); openPerson(id); render(); };
    btns.appendChild(rmp);
  }
  cw.appendChild(btns);
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = p.img ? "円の中をドラッグして顔の位置を合わせられます。" : "正方形でなくてもOK。丸く切り抜かれます。";
  cw.appendChild(hint);
  inner.appendChild(cw);

  function paint(){
    if(p.img && p.img.src){
      box.style.backgroundImage = "url('" + p.img.src + "')";
      box.style.backgroundSize = (work.zoom * 100) + "% auto";
      box.style.backgroundPosition = work.x + "% " + work.y + "%";
      box.textContent = "";
      box.style.color = "transparent";
    } else {
      box.style.backgroundImage = "none";
      box.style.background = p.color;
      box.style.display = "flex";
      box.style.alignItems = "center";
      box.style.justifyContent = "center";
      box.style.color = "#fff";
      box.style.fontSize = "54px";
      box.style.fontWeight = "700";
      box.textContent = initials(nameInput ? nameInput.value : p.name);
    }
  }
  rng.oninput = () => { work.zoom = rng.value / 100; paint(); };

  let pan = null;
  box.addEventListener("pointerdown", e => {
    if(!p.img) return;
    pan = { sx:e.clientX, sy:e.clientY, ox:work.x, oy:work.y };
    box.setPointerCapture(e.pointerId);
  });
  box.addEventListener("pointermove", e => {
    if(!pan) return;
    work.x = Math.max(0, Math.min(100, pan.ox - (e.clientX - pan.sx) * 0.35));
    work.y = Math.max(0, Math.min(100, pan.oy - (e.clientY - pan.sy) * 0.35));
    paint();
  });
  box.addEventListener("pointerup", () => pan = null);
  box.addEventListener("pointercancel", () => pan = null);

  pick.onclick = () => {
    const f = document.createElement("input");
    f.type = "file"; f.accept = "image/*";
    f.onchange = () => {
      if(!f.files[0]) return;
      shrink(f.files[0]).then(src => {
        p.img = { src, zoom:1, x:50, y:50 };
        work.zoom = 1; work.x = 50; work.y = 50;
        rng.value = "100";
        closeModal(); openPerson(id); render();
      });
    };
    f.click();
  };

  const f1 = document.createElement("div"); f1.className = "field";
  f1.innerHTML = "<label>名前</label>";
  const nameInput = document.createElement("input");
  nameInput.type = "text"; nameInput.value = p.name;
  nameInput.oninput = paint;
  f1.appendChild(nameInput);
  inner.appendChild(f1);

  const f2 = document.createElement("div"); f2.className = "field";
  f2.innerHTML = "<label>メモ（現在の所属・評価・希望など）</label>";
  const noteInput = document.createElement("input");
  noteInput.type = "text"; noteInput.value = p.note || "";
  noteInput.placeholder = "例）現A店・3年目・店長候補";
  f2.appendChild(noteInput);
  inner.appendChild(f2);

  const f3 = document.createElement("div"); f3.className = "field";
  f3.innerHTML = "<label>色（写真なしのときのアイコン色）</label>";
  const sws = document.createElement("div"); sws.className = "swatches";
  COLORS.forEach(c => {
    const s = document.createElement("div");
    s.className = "sw" + (c === p.color ? " on" : "");
    s.style.background = c;
    s.onclick = () => { p.color = c; sws.querySelectorAll(".sw").forEach(x => x.classList.remove("on")); s.classList.add("on"); paint(); };
    sws.appendChild(s);
  });
  f3.appendChild(sws);
  inner.appendChild(f3);

  const f4 = document.createElement("div"); f4.className = "field";
  f4.innerHTML = "<label>配置</label>";
  const sel = document.createElement("select");
  sel.innerHTML = "<option value=''>未配属</option>";
  allSlots().forEach(({store, slot}) => {
    const o = document.createElement("option");
    o.value = slot.id;
    const occ = cur().assign[slot.id];
    o.textContent = store.name + " / " + slot.title + (occ && occ !== p.id ? "（" + (staffById(occ)||{}).name + "）" : "");
    if(cur().assign[slot.id] === p.id) o.selected = true;
    sel.appendChild(o);
  });
  f4.appendChild(sel);
  inner.appendChild(f4);

  paint();

  const del = document.createElement("button");
  del.className = "btn ghost danger";
  del.textContent = "削除";
  del.style.marginRight = "auto";
  del.onclick = () => {
    if(!confirm((p.name || "このスタッフ") + " を削除しますか？")) return;
    state.scenarios.forEach(sc => { const s = Object.keys(sc.assign).find(k => sc.assign[k] === p.id); if(s) delete sc.assign[s]; });
    state.staff = state.staff.filter(x => x.id !== p.id);
    closeModal(); render();
  };
  foot.appendChild(del);

  const cancel = document.createElement("button");
  cancel.className = "btn"; cancel.textContent = "キャンセル";
  cancel.onclick = closeModal;
  foot.appendChild(cancel);

  const ok = document.createElement("button");
  ok.className = "btn primary"; ok.textContent = "保存";
  ok.onclick = () => {
    p.name = nameInput.value.trim() || p.name;
    p.note = noteInput.value.trim();
    if(p.img){ p.img.zoom = work.zoom; p.img.x = work.x; p.img.y = work.y; }
    const s = slotOf(p.id);
    if(s) delete cur().assign[s];
    if(sel.value) assign(sel.value, p.id);
    closeModal(); render();
  };
  foot.appendChild(ok);
}

/* ============================================================
   画像の縮小（保存サイズ対策）
   ============================================================ */
function shrink(file, max){
  max = max || 480;
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const sc = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => res(null);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============================================================
   追加・保存・読み込み
   ============================================================ */
function addStaff(name, imgSrc){
  const p = {
    id: nid(),
    name: name || "スタッフ" + (state.staff.length + 1),
    note: "",
    color: COLORS[state.staff.length % COLORS.length],
    img: imgSrc ? { src:imgSrc, zoom:1, x:50, y:50 } : null
  };
  state.staff.push(p);
  return p;
}

document.getElementById("btnAddPeople").onclick = () => document.getElementById("filePhotos").click();
document.getElementById("filePhotos").onchange = async (e) => {
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  for(const f of files){
    const src = await shrink(f);
    const nm = f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
    addStaff(nm, src);
  }
  e.target.value = "";
  render();
  toast(files.length + "名を追加しました。名前は丸アイコンの「✎」から直せます");
};

document.getElementById("btnAddOne").onclick = () => {
  const n = prompt("スタッフの名前");
  if(n === null) return;
  const p = addStaff(n.trim(), null);
  render();
  openPerson(p.id);
};

document.getElementById("btnPrint").onclick = () => window.print();

document.getElementById("btnSave").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "staffing-board.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("配置データを書き出しました（写真も含まれます）");
};

document.getElementById("btnLoad").onclick = () => document.getElementById("fileJson").click();
document.getElementById("fileJson").onchange = (e) => {
  const f = e.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d.staff || !d.stores) throw new Error("形式が違います");
      state = d;
      if(!state.scenarios || !state.scenarios.length){
        state.scenarios = [{id:nid(), name:"案A", assign:{}}];
      }
      if(!state.current || !state.scenarios.some(s => s.id === state.current)) state.current = state.scenarios[0].id;
      render();
      toast("読み込みました");
    }catch(err){ alert("読み込めませんでした：" + err.message); }
    e.target.value = "";
  };
  fr.readAsText(f);
};

document.getElementById("search").oninput = renderPool;

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

/* 写真をサイドバーにドロップして一括追加 */
const poolEl = document.getElementById("pool");
["dragenter","dragover"].forEach(ev => poolEl.addEventListener(ev, e => { e.preventDefault(); poolEl.classList.add("drop-hot"); }));
["dragleave","drop"].forEach(ev => poolEl.addEventListener(ev, e => { e.preventDefault(); poolEl.classList.remove("drop-hot"); }));
poolEl.addEventListener("drop", async e => {
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith("image/"));
  if(!files.length) return;
  for(const f of files){
    const src = await shrink(f);
    addStaff(f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim(), src);
  }
  render();
  toast(files.length + "名を追加しました");
});

seed();
